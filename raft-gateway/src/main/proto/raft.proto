syntax = "proto3";
option java_package = "raf.rs";
option java_multiple_files = true;

service RAFT {
  rpc ClientCommand (Command) returns (ClientMessageRes);
  rpc Stop(StopReq) returns (StopRes);
  rpc GetAllMessages (MessageRequest) returns (AllMessages);
  rpc ClearMessages (ClearMessagesReq) returns (ClearMessagesRes);
  rpc Pause(PauseReq) returns (PauseRes);
  rpc Resume(ResumeReq) returns (ResumeRes);
  rpc GetNodeLog (NodeLogReq) returns (NodeLogRes);
}
message Command {
  oneof type {
    AddCommand addCommand = 1;
    DeleteCommand deleteCommand = 2;
  }
}
message AddCommand {
  int32  messageId = 1;
  string user      = 2;
  string message   = 3;
  string timestamp = 4;
}
message DeleteCommand {
  int32  messageId = 1;
  string user      = 2;
}
message StopReq {}
message StopRes {
  string message = 1;
}
message ClientMessageRes{
  bool   success = 1;
  string info    = 2;
}
message MessageRequest {}
message AllMessages {
  repeated Message message = 1;
}
message Message {
  int32  messageId = 1;
  string user      = 2;
  string message   = 3;
  string timestamp = 4;
  bool deleted = 5;
  int32  logIndex = 6;
}
message PauseReq  {}
message PauseRes  {}
message ResumeReq {}
message ResumeRes {}
message ClearMessagesReq {}
message ClearMessagesRes { bool success = 1; }
message NodeLogReq {}
message LogEntryInfo {
  int32  index       = 1;
  int32  term        = 2;
  string commandType = 3;
  string user        = 4;
  string content     = 5;
  bool   committed   = 6;
}
message NodeLogRes {
  repeated LogEntryInfo entries     = 1;
  int32                 commitIndex = 2;
  string                nodeState   = 3;
}