server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/stream {
        proxy_pass http://raft-gateway:8080/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://raft-gateway:8080/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
