syntax = "proto3";
option java_package = "raf.rs.RPC";
option java_multiple_files = true;

service RAFT {
  rpc AppendEntries(AppendEntriesReq) returns (AppendEntriesRes);
  rpc RequestVote(RequestVoteReq) returns (RequestVoteRes);
  rpc Stop(StopReq) returns (StopRes);
}
message AppendEntriesReq {
  int64 term = 1;
  int64 leaderId = 2;
  int64 prevLogIndex = 3;
  int64 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  int64 leaderCommit = 6;
}
message LogEntry {
  int64 index = 1;
  int64 term = 2;
  string command = 3;
}
message AppendEntriesRes {
  int64 term = 1;
  bool success = 2;
}
message RequestVoteReq {
  int64 term = 1;
  int64 candidateId = 2;
  int64 lastLogIndex = 3;
  int64 lastLogTerm = 4;
}
message RequestVoteRes {
  int64 term = 1;
  bool voteGranted = 2;
}
message StopReq {}
message StopRes {
  string message = 1;
}